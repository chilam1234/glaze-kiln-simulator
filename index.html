<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Glaze Kiln — pottery glaze simulator</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{ "imports": {
  "three": "./vendor/three.module.js",
  "three/addons/": "./vendor/addons/"
} }
</script>
</head>
<body>
<aside id="panel">
  <h1>Glaze Kiln <span>v3</span></h1>
  <section>
    <h2>Pot</h2>
    <div class="shapes" id="shapes">
      <button data-shape="cylinder">Cylinder</button>
      <button data-shape="bowl">Bowl</button>
      <button data-shape="vase">Vase</button>
      <button data-shape="plate">Plate</button>
      <button data-shape="chawan" title="Tea bowl (chawan)">Chawan</button>
      <button data-shape="bottle">Bottle</button>
      <button data-shape="jar">Jar</button>
      <button data-shape="mug">Mug</button>
    </div>
  </section>
  <section>
    <h2>Glaze</h2>
    <div id="glazes"></div>
    <p id="glazeNow" class="hint"></p>
    <label class="slider">Thickness <output id="thickOut"></output>
      <input type="range" id="thick" min="0.1" max="1.5" step="0.05"></label>
  </section>
  <section>
    <h2>Tool</h2>
    <div class="row seg" id="tools">
      <button data-tool="brush">Brush</button>
      <button data-tool="pour">Pour / dip</button>
    </div>
    <div id="brushOpts">
      <label class="slider">Brush size <output id="sizeOut"></output>
        <input type="range" id="size" min="0.03" max="0.4" step="0.01" value="0.12"></label>
      <p class="hint">Drag on the pot to paint. Drag off the pot (or right-drag) to orbit.</p>
    </div>
    <div id="pourOpts" hidden>
      <label class="slider">Line height <output id="pourHOut"></output>
        <input type="range" id="pourH" min="0" max="1" step="0.01" value="0.66"></label>
      <div class="row seg" id="pourMode">
        <button data-mode="below">Below line</button>
        <button data-mode="above">Above line</button>
      </div>
      <button id="pourBtn" class="wide">Pour</button>
      <p class="hint">Or click on the pot to pour at that height.</p>
    </div>
    <label class="check"><input type="checkbox" id="wax" checked> Wax the foot (keep it bare)</label>
  </section>
  <section class="actions">
    <button id="fireBtn" class="fire">Fire kiln</button>
    <div class="row">
      <button id="unfireBtn">Unfire / keep painting</button>
      <button id="clearBtn">Clear</button>
    </div>
  </section>
  <p id="status">Loading…</p>
  <p class="credit">Glaze colors approximated from AMACO product photos. Not affiliated with AMACO.</p>
</aside>
<main id="view"></main>
<script type="module" src="js/main.js"></script>
</body>
</html>
