<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Glaze Kiln — pottery glaze simulator</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<style>
/* Palette taken from amaco.com (themes/amaco/assets/theme.css + computed styles on the home page, fetched 2026-09-27).
   Only the colours and the font *styles* are borrowed. No logo, images or remote fonts; everything works offline. */
:root {
  --amaco-navy: #074684;        /* --primary / --blue, .btn-primary background */
  --amaco-navy-dark: #053360;   /* .btn-primary:hover background */
  --amaco-yellow: #ffbd2e;      /* --secondary / --yellow, .btn-secondary background */
  --amaco-yellow-hover: #ffb108;/* .btn-secondary:hover background */
  --amaco-yellow-edge: #faab00; /* .btn-secondary:hover border */
  --amaco-ink: #001224;         /* --dark, body text colour */
  --amaco-ink-deep: #00070e;    /* .btn-secondary text */
  --amaco-slate: #525d7d;       /* secondary text/link colour, section backgrounds */
  --amaco-sky: #7ea3cc;         /* h2 colour, top announcement bar */
  --amaco-azure: #1b82f7;       /* a / .btn-link colour */
  --amaco-mist: #e8eef2;        /* borders, thumbnails, hero panel */
  --amaco-smoke: #f5f5f5;       /* most frequent section background */
  --amaco-light: #fdfdfd;       /* --light */
  --amaco-white: #ffffff;

  --panel-bg: var(--amaco-smoke);
  --panel-border: var(--amaco-mist);
  --text: var(--amaco-ink);
  --text-muted: var(--amaco-slate);
  --btn-bg: var(--amaco-light);
  --btn-border: #c9d4de;        /* mist deepened slightly so outlines stay visible on smoke */
  --btn-hover: var(--amaco-mist);
  --active-bg: var(--amaco-navy);
  --active-fg: var(--amaco-white);
  --focus: var(--amaco-azure);
  --fire-bg: var(--amaco-yellow);
  --fire-hover: var(--amaco-yellow-hover);
  --fire-edge: var(--amaco-yellow-edge);
  --fire-fg: var(--amaco-ink-deep);
  --scene-bg: #dcdfe2;          /* neutral light grey nudged toward --amaco-mist, keeps glaze colours true */
  /* amaco.com uses Metropolis (body), YoungSerif (headings), Barlow Condensed (buttons). These are close system stacks: */
  --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-head: "Young Serif", Georgia, Cambria, "Times New Roman", serif;
  --font-btn: "Barlow Condensed", "Roboto Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; font: 13px/1.4 var(--font-body); color: var(--text); background: var(--scene-bg); overflow: hidden; user-select: none; -webkit-user-select: none; }
body { display: flex; }
#panel { width: 270px; flex: none; padding: 14px 16px; background: var(--panel-bg); border-right: 1px solid var(--panel-border); box-shadow: 1px 0 0 rgba(0, 18, 36, .06); overflow-y: auto; }
#view { flex: 1; position: relative; }
#view canvas { display: block; width: 100%; height: 100%; touch-action: none; }
h1 { font: 400 20px/1.2 var(--font-head); color: var(--amaco-ink); margin: 0 0 10px; letter-spacing: .01em; border-bottom: 3px solid var(--amaco-yellow); padding-bottom: 6px; }
h1 span { font: 600 11px var(--font-body); color: var(--amaco-navy); }
h2 { font: 600 11px var(--font-body); text-transform: uppercase; letter-spacing: .1em; color: var(--amaco-navy); margin: 14px 0 6px; }
section { border-bottom: 1px solid var(--panel-border); padding-bottom: 8px; }
.row { display: flex; gap: 6px; margin: 4px 0; }
.row > * { flex: 1; }
button { font: 500 13px var(--font-btn); letter-spacing: .03em; padding: 6px 8px; border: 1px solid var(--btn-border); border-radius: 4px; background: var(--btn-bg); color: var(--text); cursor: pointer; }
button:hover { background: var(--btn-hover); border-color: var(--amaco-navy); }
button:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
button.active { background: var(--active-bg); color: var(--active-fg); border-color: var(--active-bg); }
button.active:hover { background: var(--amaco-navy-dark); }
button:disabled { opacity: .45; cursor: default; }
button:disabled:hover { background: var(--btn-bg); border-color: var(--btn-border); }
button.wide { width: 100%; margin-top: 6px; background: var(--amaco-navy); color: var(--amaco-white); border-color: var(--amaco-navy); text-transform: uppercase; }
button.wide:hover { background: var(--amaco-navy-dark); }
button.fire { width: 100%; padding: 10px; font: 700 15px var(--font-btn); text-transform: uppercase; letter-spacing: .08em; background: var(--fire-bg); color: var(--fire-fg); border: 2px solid var(--fire-bg); box-shadow: 0 2px 0 var(--fire-edge); }
button.fire:hover { background: var(--fire-hover); border-color: var(--fire-edge); }
button.fire:disabled:hover { background: var(--fire-bg); border-color: var(--fire-bg); }
#shapes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin: 4px 0; }
#shapes button { padding: 6px 2px; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#glazes { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; max-height: 292px; overflow-y: auto; padding: 0 4px 4px 0;
  scrollbar-width: thin; scrollbar-color: var(--amaco-sky) transparent; }
#glazes .fam { grid-column: 1 / -1; position: sticky; top: 0; z-index: 1; margin-top: 4px; padding: 3px 6px; background: var(--amaco-navy);
  color: #fff; font: 700 10.5px var(--font-body); letter-spacing: 0.08em; text-transform: uppercase; border-radius: 3px; }
#glazes .fam:first-child { margin-top: 0; }
#glazeNow { margin: 6px 0 2px; min-height: 2.4em; }
#glazeNow b { color: var(--amaco-navy); }
.glaze .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.glaze { display: flex; align-items: center; gap: 6px; padding: 3px 5px; min-width: 0; text-align: left; font: 500 12.5px var(--font-body); letter-spacing: 0; }
.glaze .sw { width: 20px; height: 20px; border-radius: 50%; flex: none; border: 2px solid var(--amaco-mist); box-shadow: 0 0 0 1px var(--amaco-slate); }
.glaze.active { outline: 2px solid var(--amaco-navy); outline-offset: -1px; background: var(--amaco-white); color: var(--amaco-ink); border-color: var(--amaco-navy); }
.glaze.active:hover { background: var(--amaco-mist); color: var(--amaco-ink); }
.glaze.active .sw { box-shadow: 0 0 0 2px var(--amaco-yellow); }
.slider { display: block; margin: 8px 0 2px; }
.slider output { float: right; color: var(--amaco-navy); font-weight: 600; }
input[type=range], input[type=checkbox] { accent-color: var(--amaco-navy); }
.slider input { width: 100%; }
.check { display: block; margin-top: 8px; }
.hint { color: var(--text-muted); font-size: 11px; margin: 4px 0; }
.actions { border: none; padding-top: 12px; }
#status { color: var(--text-muted); font-size: 12px; min-height: 2.8em; }

.credit { margin: 10px 0 0; padding-top: 8px; border-top: 1px solid var(--amaco-mist); font: 400 10.5px var(--font-body); color: var(--amaco-slate); line-height: 1.35; }
.glaze .nm { line-height: 1.15; }
.glaze .nm small { display: block; font: 600 10px var(--font-body); color: var(--amaco-slate); letter-spacing: .02em; }
.glaze .nm { white-space: normal; }

</style>
</head>
<body>
<aside id="panel">
  <h1>Glaze Kiln <span>v3</span></h1>
  <section>
    <h2>Pot</h2>
    <div class="shapes" id="shapes">
      <button data-shape="cylinder">Cylinder</button>
      <button data-shape="bowl">Bowl</button>
      <button data-shape="vase">Vase</button>
      <button data-shape="plate">Plate</button>
      <button data-shape="chawan" title="Tea bowl (chawan)">Chawan</button>
      <button data-shape="bottle">Bottle</button>
      <button data-shape="jar">Jar</button>
      <button data-shape="mug">Mug</button>
    </div>
  </section>
  <section>
    <h2>Glaze</h2>
    <div id="glazes"></div>
    <p id="glazeNow" class="hint"></p>
    <label class="slider">Thickness <output id="thickOut"></output>
      <input type="range" id="thick" min="0.1" max="1.5" step="0.05"></label>
  </section>
  <section>
    <h2>Tool</h2>
    <div class="row seg" id="tools">
      <button data-tool="brush">Brush</button>
      <button data-tool="pour">Pour / dip</button>
    </div>
    <div id="brushOpts">
      <label class="slider">Brush size <output id="sizeOut"></output>
        <input type="range" id="size" min="0.03" max="0.4" step="0.01" value="0.12"></label>
      <p class="hint">Drag on the pot to paint. Drag off the pot (or right-drag) to orbit.</p>
    </div>
    <div id="pourOpts" hidden>
      <label class="slider">Line height <output id="pourHOut"></output>
        <input type="range" id="pourH" min="0" max="1" step="0.01" value="0.66"></label>
      <div class="row seg" id="pourMode">
        <button data-mode="below">Below line</button>
        <button data-mode="above">Above line</button>
      </div>
      <button id="pourBtn" class="wide">Pour</button>
      <p class="hint">Or click on the pot to pour at that height.</p>
    </div>
    <label class="check"><input type="checkbox" id="wax" checked> Wax the foot (keep it bare)</label>
  </section>
  <section class="actions">
    <button id="fireBtn" class="fire">Fire kiln</button>
    <div class="row">
      <button id="unfireBtn">Unfire / keep painting</button>
      <button id="clearBtn">Clear</button>
    </div>
  </section>
  <p id="status">Loading…</p>
  <p class="credit">Glaze colors approximated from AMACO product photos. Not affiliated with AMACO.</p>
</aside>
<main id="view"></main>
